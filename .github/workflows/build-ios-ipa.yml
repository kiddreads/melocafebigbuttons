name: Build MeloCafe (iOS IPA)

# build.yml only builds the desktop/AppImage targets - there is no CI job anywhere
# in this repo that produces an iOS build. This workflow builds the actual iOS app:
#   1. Configure the Cemu core for arm64-ios with CMake's Xcode generator. This is
#      what MeloCafe/MeloCafe.xcodeproj expects: it has a project reference to
#      build/src/cemuMain.xcodeproj rather than linking a prebuilt framework from a
#      fixed path. Configuring with -G Xcode is what creates that nested project;
#      xcodebuild then builds it as a normal target dependency of the MeloCafe scheme.
#   2. Build the MeloCafe scheme for iphoneos.
#   3. Package an unsigned IPA (SideStore/AltStore/LiveContainer-style; they re-sign
#      on install) since this repo has no code signing identity configured
#      (DEVELOPMENT_TEAM is blank, CODE_SIGN_STYLE is Automatic).

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select the newest available Xcode
        # Melo-Controller (a remote SPM package the MeloCafe target depends on) uses
        # the optional default in string interpolation ("\(x, default: "y")"), which
        # needs Swift 6.2+. The runner's default Xcode may reject that as
        # "extra argument 'default' in call", so pick whichever Xcode is newest on
        # the runner instead of hardcoding a version that may not exist on it. Used
        # for both the CMake configure/build below and the final app build, so the
        # Cemu core and the app are built with the same toolchain throughout.
        run: |
          set -eo pipefail
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Identify the pinned vcpkg commit
        id: vcpkg
        run: echo "rev=$(git -C dependencies/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-archives
          key: melocafebigbuttons-vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}
          restore-keys: |
            melocafebigbuttons-vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-

      - name: Configure the Cemu core for iOS (generates build/src/cemuMain.xcodeproj)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite"
        run: |
          set -eo pipefail
          mkdir -p .vcpkg-archives
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DVCPKG_TARGET_TRIPLET=arm64-ios \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            2>&1 | tee configure.log
          test -f build/src/cemuMain.xcodeproj/project.pbxproj

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-archives
          key: melocafebigbuttons-vcpkg-arm64-ios-${{ steps.vcpkg.outputs.rev }}-${{ hashFiles('vcpkg.json', 'triplets/**', 'dependencies/vcpkg_overlay_ports/**', 'dependencies/vcpkg_overlay_ports_mac/**') }}

      - name: Build the Cemu core (CemuBin) for iOS
        # MeloCafe.xcodeproj links against libraries produced by build/src/cemuMain.xcodeproj
        # (CemuCafe, which in turn links the vendored ih264d/ZArchive/xbyak_aarch64
        # dependency targets - all declared EXCLUDE_FROM_ALL in CMakeLists.txt, so
        # they are not part of Xcode's default ALL_BUILD). Building the MeloCafe
        # scheme directly relies on xcodebuild resolving that whole dependency chain
        # through the project reference, which it did not: the app link step failed
        # with "no such file or directory" for libih264d.a/libzarchive.a/
        # libxbyak_aarch64.a because nothing had built them yet. Building the actual
        # CemuBin target through CMake first (which does walk target_link_libraries
        # regardless of EXCLUDE_FROM_ALL) guarantees those .a files exist on disk
        # before the app is linked against them.
        run: |
          set -eo pipefail
          cmake --build build --config Release --target CemuBin -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee core-build.log

      - name: Build the MeloCafe app
        run: |
          set -eo pipefail
          xcodebuild -project MeloCafe/MeloCafe.xcodeproj -scheme MeloCafe -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "MeloCafe.app" -path "*Release-iphoneos*" | head -n1)
          if [ -z "$APP_PATH" ]; then echo "::error::no MeloCafe.app produced"; exit 1; fi
          rm -rf Payload MeloCafe.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MeloCafe.ipa Payload
          echo "IPA size: $(du -h MeloCafe.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloCafe-ipa
          path: MeloCafe.ipa
          retention-days: 30

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build-logs
          path: |
            configure.log
            core-build.log
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 30
